name: Rappels et nouveautés

# Réveille l'API chaque heure : elle envoie les rappels d'inactivité (24 h) et annonce les nouveautés.
# Secrets du dépôt à créer : API_URL (ex. https://akademia-api.onrender.com) et CRON_SECRET (même valeur que sur Render).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/tick
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets API_URL / CRON_SECRET absents"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "x-cron-secret: $CRON_SECRET" "${API_URL%/}/api/cron/tick"
