<svg width="620" height="282" viewBox="0 0 620 282" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Table de routage : choisir la route la plus spécifique</title>
<rect x="0" y="0" width="620" height="282" fill="#ffffff"/>
<text x="310" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">R1 doit joindre 192.168.2.10 : deux routes possibles</text>
<rect x="40" y="50" width="70" height="26" rx="13.0" ry="13.0" fill="#1C7ED6"/>
<text x="75.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">R1</text>
<rect x="230" y="50" width="70" height="26" rx="13.0" ry="13.0" fill="#0E9F9A"/>
<text x="265.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">R2</text>
<rect x="420" y="50" width="70" height="26" rx="13.0" ry="13.0" fill="#7C3AED"/>
<text x="455.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">R3</text>
<rect x="500" y="90" width="100" height="34" rx="8" ry="8" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="550.0" y="105.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">192.168.2.0/24</text>
<text x="550.0" y="120.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="7.8" fill="rgb(90,100,120)">réseau cible</text>
<defs><marker id="ah10" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="110" y1="63" x2="230" y2="63" stroke="rgb(10,22,38)" stroke-width="1.4" marker-end="url(#ah10)"/>
<text x="170.0" y="57.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="rgb(10,22,38)">S0/0/0</text>
<defs><marker id="ah13" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="300" y1="63" x2="420" y2="63" stroke="rgb(10,22,38)" stroke-width="1.4" marker-end="url(#ah13)"/>
<text x="360.0" y="57.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="rgb(10,22,38)">S0/0/1</text>
<defs><marker id="ah16" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="455" y1="63" x2="500" y2="100" stroke="rgb(10,22,38)" stroke-width="1.4" marker-end="url(#ah16)"/>
<rect x="40" y="130" width="70" height="26" rx="13.0" ry="13.0" fill="#E8590C"/>
<text x="75.0" y="146.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">R4</text>
<defs><marker id="ah20" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(150,160,180)"/></marker></defs>
<line x1="60" y1="76" x2="60" y2="130" stroke="rgb(150,160,180)" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#ah20)"/>
<text x="60.0" y="97.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="rgb(150,160,180)">autre lien</text>
<rect x="20" y="175" width="290" height="95" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="30" y="192" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10" fill="rgb(10,22,38)" style="">Table de routage de R1</text>
<text x="30" y="210" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="9" fill="#166534" style="">192.168.2.0 /24  via S0/0/0  (métrique 2)</text>
<text x="30" y="224" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">0.0.0.0 /0 (route par défaut)  via S0/0/1</text>
<text x="30" y="240" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.6" fill="#166534" style="font-style:italic;">→ /24 est plus spécifique que /0 : route choisie</text>
<text x="30" y="254" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.2" fill="rgb(90,100,120)" style="font-style:italic;">(longest prefix match)</text>
<rect x="330" y="175" width="270" height="95" rx="8" ry="8" fill="#ffffff" stroke="rgb(190,198,210)" stroke-width="1.3"/>
<text x="340" y="192" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10" fill="rgb(10,22,38)" style="">Règle du plus long préfixe</text>
<text x="340" y="210" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">Un paquet vers 192.168.2.10 correspond</text>
<text x="340" y="223" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">à PLUSIEURS routes possibles ; le routeur</text>
<text x="340" y="236" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">choisit toujours celle au masque le plus</text>
<text x="340" y="249" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">long (le plus précis), jamais la plus courte.</text>
</svg>