<svg width="560" height="280" viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Dialogue DHCP : DISCOVER, OFFER, REQUEST, ACK</title>
<rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
<text x="280" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Le dialogue DORA : un client obtient une adresse IP</text>
<rect x="50" y="44" width="110" height="28" rx="14.0" ry="14.0" fill="#1C7ED6"/>
<text x="105.0" y="61.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">Client</text>
<rect x="400" y="44" width="110" height="28" rx="14.0" ry="14.0" fill="#0E9F9A"/>
<text x="455.0" y="61.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">Serveur DHCP</text>
<line x1="105" y1="72" x2="105" y2="240" stroke="rgb(190,198,212)" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="455" y1="72" x2="455" y2="240" stroke="rgb(190,198,212)" stroke-width="1.2" stroke-dasharray="3,3"/>
<defs><marker id="ah7" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1C7ED6"/></marker></defs>
<line x1="105" y1="90" x2="455" y2="90" stroke="#1C7ED6" stroke-width="1.8" marker-end="url(#ah7)"/>
<text x="280.0" y="82" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="#1C7ED6" style="">1 · DISCOVER</text>
<text x="280.0" y="104" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.2" fill="rgb(90,100,120)" style="">diffusion : « qui peut me donner une IP ? »</text>
<defs><marker id="ah11" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#0E9F9A"/></marker></defs>
<line x1="455" y1="135" x2="105" y2="135" stroke="#0E9F9A" stroke-width="1.8" marker-end="url(#ah11)"/>
<text x="280.0" y="127" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="#0E9F9A" style="">2 · OFFER</text>
<text x="280.0" y="149" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.2" fill="rgb(90,100,120)" style="">propose une adresse disponible</text>
<defs><marker id="ah15" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1C7ED6"/></marker></defs>
<line x1="105" y1="180" x2="455" y2="180" stroke="#1C7ED6" stroke-width="1.8" marker-end="url(#ah15)"/>
<text x="280.0" y="172" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="#1C7ED6" style="">3 · REQUEST</text>
<text x="280.0" y="194" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.2" fill="rgb(90,100,120)" style="">confirme l'adresse proposée (en diffusion)</text>
<defs><marker id="ah19" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#0E9F9A"/></marker></defs>
<line x1="455" y1="225" x2="105" y2="225" stroke="#0E9F9A" stroke-width="1.8" marker-end="url(#ah19)"/>
<text x="280.0" y="217" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="#0E9F9A" style="">4 · ACK</text>
<text x="280.0" y="239" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.2" fill="rgb(90,100,120)" style="">valide le bail : adresse, durée, passerelle, DNS</text>
<text x="280" y="262" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.6" fill="rgb(90,100,120)" style="">DORA : Discover → Offer → Request → Acknowledge. Le bail est renouvelé avant son expiration (T1 ≈ 50 %, T2 ≈ 87,5 % de sa durée).</text>
</svg>