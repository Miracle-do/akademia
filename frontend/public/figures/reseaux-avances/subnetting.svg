<svg width="620" height="225" viewBox="0 0 620 225" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Subnetting : découper 192.168.1.0/24 en 4 sous-réseaux /26</title>
<rect x="0" y="0" width="620" height="225" fill="#ffffff"/>
<text x="310" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="11.8" fill="rgb(90,100,120)" style="">192.168.1.0/24 découpé en 4 sous-réseaux /26 (emprunt de 2 bits)</text>
<rect x="20" y="36" width="580" height="34" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="310.0" y="57.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10.5" fill="rgb(10,22,38)">192.168.1.0 /24 — 256 adresses, masque 255.255.255.0</text>
<defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(150,160,180)"/></marker></defs>
<line x1="310" y1="72" x2="310" y2="90" stroke="rgb(150,160,180)" stroke-width="1.4" marker-end="url(#ah3)"/>
<text x="330" y="83" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">emprunter 2 bits à la partie hôte  →  4 sous-réseaux de 64 adresses</text>
<rect x="20" y="100" width="135" height="86" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="87.5" y="120" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)" style="">192.168.1.0/26</text>
<text x="87.5" y="142" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.4" fill="rgb(10,22,38)" style="">hôtes .1 → .62</text>
<text x="87.5" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.0" fill="rgb(90,100,120)" style="">diffusion .63</text>
<rect x="165" y="100" width="135" height="86" rx="8" ry="8" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="232.5" y="120" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)" style="">192.168.1.64/26</text>
<text x="232.5" y="142" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.4" fill="rgb(10,22,38)" style="">hôtes .65 → .126</text>
<text x="232.5" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.0" fill="rgb(90,100,120)" style="">diffusion .127</text>
<rect x="310" y="100" width="135" height="86" rx="8" ry="8" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="377.5" y="120" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)" style="">192.168.1.128/26</text>
<text x="377.5" y="142" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.4" fill="rgb(10,22,38)" style="">hôtes .129 → .190</text>
<text x="377.5" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.0" fill="rgb(90,100,120)" style="">diffusion .191</text>
<rect x="455" y="100" width="135" height="86" rx="8" ry="8" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="522.5" y="120" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)" style="">192.168.1.192/26</text>
<text x="522.5" y="142" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.4" fill="rgb(10,22,38)" style="">hôtes .193 → .254</text>
<text x="522.5" y="160" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.0" fill="rgb(90,100,120)" style="">diffusion .255</text>
<text x="20" y="205" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="9" fill="rgb(90,100,120)" style="">Masque /26 = 255.255.255.192 → 64 adresses par sous-réseau (62 utilisables : réseau et diffusion réservés).</text>
</svg>