<svg width="620" height="272" viewBox="0 0 620 272" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>VLAN et trunking 802.1Q entre deux commutateurs</title>
<rect x="0" y="0" width="620" height="272" fill="#ffffff"/>
<text x="310" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Deux commutateurs reliés par un lien trunk 802.1Q</text>
<rect x="60" y="50" width="180" height="50" rx="9" ry="9" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="150.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10.5" fill="rgb(10,22,38)">Commutateur SW1</text>
<rect x="380" y="50" width="180" height="50" rx="9" ry="9" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="470.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10.5" fill="rgb(10,22,38)">Commutateur SW2</text>
<defs><marker id="ah5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1C7ED6"/></marker></defs>
<line x1="240" y1="75" x2="380" y2="75" stroke="#1C7ED6" stroke-width="2.2" marker-end="url(#ah5)"/>
<text x="310" y="64" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="8.6" fill="#1C7ED6" style="">VLAN 10 + 20 + 30</text>
<text x="310" y="90" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.2" fill="#1C7ED6" style="">Trunk (port taggé)</text>
<rect x="20" y="128" width="120" height="30" rx="7" ry="7" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="80.0" y="147.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 10</text>
<text x="150" y="147" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Administration</text>
<line x1="85" y1="100" x2="85" y2="128" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="20" y="166" width="120" height="30" rx="7" ry="7" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="80.0" y="185.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 20</text>
<text x="150" y="185" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Comptabilité</text>
<line x1="85" y1="100" x2="85" y2="166" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="20" y="204" width="120" height="30" rx="7" ry="7" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="80.0" y="223.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 30</text>
<text x="150" y="223" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Invités</text>
<line x1="85" y1="100" x2="85" y2="204" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="480" y="128" width="120" height="30" rx="7" ry="7" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="540.0" y="147.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 10</text>
<text x="470" y="147" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Administration</text>
<line x1="455" y1="100" x2="540" y2="128" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="480" y="166" width="120" height="30" rx="7" ry="7" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="540.0" y="185.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 20</text>
<text x="470" y="185" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Comptabilité</text>
<line x1="455" y1="100" x2="540" y2="166" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="480" y="204" width="120" height="30" rx="7" ry="7" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="540.0" y="223.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">VLAN 30</text>
<text x="470" y="223" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Invités</text>
<line x1="455" y1="100" x2="540" y2="204" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<text x="20" y="252" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">Ports access (vers les postes) : une seule VLAN, sans étiquette.</text>
<text x="20" y="264" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">Port trunk : plusieurs VLAN, chaque trame porte une étiquette 802.1Q (son numéro de VLAN).</text>
</svg>