<text x="391.0" y="153.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="7.4" fill="rgb(90,100,120)">temporaire</text>
<line x1="320" y1="66" x2="461.0" y2="110" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="430" y="110" width="62" height="60" rx="7" ry="7" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="461.0" y="138.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.4" fill="rgb(10,22,38)">/dev</text>
<text x="461.0" y="153.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="7.4" fill="rgb(90,100,120)">périphériques</text>
<line x1="320" y1="66" x2="531.0" y2="110" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="500" y="110" width="62" height="60" rx="7" ry="7" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="531.0" y="138.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.4" fill="rgb(10,22,38)">/proc, /sys</text>
<text x="531.0" y="153.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="7.4" fill="rgb(90,100,120)">noyau (virtuel)</text>
<line x1="320" y1="66" x2="601.0" y2="110" stroke="rgb(190,198,212)" stroke-width="1" stroke-dasharray="2,3"/>
<rect x="570" y="110" width="62" height="60" rx="7" ry="7" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="601.0" y="138.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.4" fill="rgb(10,22,38)">/boot</text>
<text x="601.0" y="153.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="7.4" fill="rgb(90,100,120)">noyau, GRUB</text>
<text x="320" y="205" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.6" fill="rgb(90,100,120)" style="">/etc : où configurer  ·  /var/log : où regarder les journaux  ·  /home : les données des utilisateurs  ·  /proc, /sys : l'état du noyau</text>
</svg>