<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Arborescence Linux : principaux répertoires depuis la racine /</title>
<rect x="0" y="0" width="640" height="220" fill="#ffffff"/>
<text x="320" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Un seul arbre, une seule racine / : tout s'y rattache</text>
