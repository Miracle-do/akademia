<svg width="640" height="252" viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Décomposer les permissions Linux : -rwxr-xr-x</title>
<rect x="0" y="0" width="640" height="252" fill="#ffffff"/>
<text x="320" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Décomposer une ligne de ls -l : -rwxr-xr--</text>
<rect x="60" y="46" width="44" height="44" rx="6" ry="6" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="82.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">-</text>
<rect x="108" y="46" width="44" height="44" rx="6" ry="6" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="130.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">r</text>
<rect x="156" y="46" width="44" height="44" rx="6" ry="6" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="178.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">w</text>
<rect x="204" y="46" width="44" height="44" rx="6" ry="6" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="226.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">x</text>
<rect x="252" y="46" width="44" height="44" rx="6" ry="6" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="274.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">r</text>
<rect x="300" y="46" width="44" height="44" rx="6" ry="6" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="322.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">-</text>
<rect x="348" y="46" width="44" height="44" rx="6" ry="6" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="370.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">x</text>
<rect x="396" y="46" width="44" height="44" rx="6" ry="6" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="418.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">r</text>
<rect x="444" y="46" width="44" height="44" rx="6" ry="6" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="466.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">-</text>
<rect x="492" y="46" width="44" height="44" rx="6" ry="6" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="514.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="rgb(10,22,38)">-</text>
<rect x="60" y="96" width="44" height="26" rx="6" ry="6" fill="#ffffff" stroke="#eef3fb" stroke-width="1.3"/>
<text x="82.0" y="113.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.6" fill="rgb(10,22,38)">type</text>
<defs><marker id="ah23" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#eef3fb"/></marker></defs>
<line x1="82.0" y1="90" x2="82.0" y2="96" stroke="#eef3fb" stroke-width="0" marker-end="url(#ah23)"/>
<rect x="108" y="96" width="140" height="26" rx="6" ry="6" fill="#ffffff" stroke="#d7e8ff" stroke-width="1.3"/>
<text x="178.0" y="113.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.6" fill="rgb(10,22,38)">u (propriétaire)</text>
<defs><marker id="ah27" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#d7e8ff"/></marker></defs>
<line x1="178.0" y1="90" x2="178.0" y2="96" stroke="#d7e8ff" stroke-width="0" marker-end="url(#ah27)"/>
<rect x="252" y="96" width="140" height="26" rx="6" ry="6" fill="#ffffff" stroke="#ffe8cc" stroke-width="1.3"/>
<text x="322.0" y="113.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.6" fill="rgb(10,22,38)">g (groupe)</text>
<defs><marker id="ah31" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#ffe8cc"/></marker></defs>
<line x1="322.0" y1="90" x2="322.0" y2="96" stroke="#ffe8cc" stroke-width="0" marker-end="url(#ah31)"/>
<rect x="396" y="96" width="140" height="26" rx="6" ry="6" fill="#ffffff" stroke="#ffd8d8" stroke-width="1.3"/>
<text x="466.0" y="113.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="8.6" fill="rgb(10,22,38)">o (autres)</text>
<defs><marker id="ah35" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#ffd8d8"/></marker></defs>
<line x1="466.0" y1="90" x2="466.0" y2="96" stroke="#ffd8d8" stroke-width="0" marker-end="url(#ah35)"/>
<text x="320" y="150" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9.4" fill="rgb(90,100,120)" style="">Chaque groupe (u, g, o) combine r (lecture, 4) + w (écriture, 2) + x (exécution, 1) : rwx = 4+2+1 = 7</text>
<rect x="130" y="172" width="130" height="56" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="195.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">r = 4</text>
<text x="195.0" y="213.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" fill="rgb(90,100,120)">lire</text>
<rect x="280" y="172" width="130" height="56" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="345.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">w = 2</text>
<text x="345.0" y="213.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" fill="rgb(90,100,120)">modifier</text>
<rect x="430" y="172" width="130" height="56" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="495.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">x = 1</text>
<text x="495.0" y="213.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" fill="rgb(90,100,120)">exécuter / traverser</text>
<text x="320" y="248" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">chmod 754 fichier  →  u = rwx (7), g = r-x (5), o = r-- (4)</text>
</svg>