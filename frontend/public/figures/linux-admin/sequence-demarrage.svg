<svg width="640" height="190" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Séquence de démarrage Linux : du firmware au login</title>
<rect x="0" y="0" width="640" height="190" fill="#ffffff"/>
<text x="320" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Chaque étage allume le suivant, puis s'efface</text>
<rect x="15" y="50" width="112" height="70" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="71.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)">1 · Firmware</text>
<text x="71.0" y="98.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.2" fill="rgb(90,100,120)">BIOS / UEFI</text>
<defs><marker id="ah4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="128" y1="85" x2="136" y2="85" stroke="rgb(10,22,38)" stroke-width="1.6" marker-end="url(#ah4)"/>
<rect x="137" y="50" width="112" height="70" rx="8" ry="8" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="193.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)">2 · GRUB2</text>
<text x="193.0" y="98.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.2" fill="rgb(90,100,120)">charge le noyau</text>
<defs><marker id="ah9" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="250" y1="85" x2="258" y2="85" stroke="rgb(10,22,38)" stroke-width="1.6" marker-end="url(#ah9)"/>
<rect x="259" y="50" width="112" height="70" rx="8" ry="8" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="315.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)">3 · Noyau</text>
<text x="315.0" y="98.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.2" fill="rgb(90,100,120)">+ initramfs</text>
<defs><marker id="ah14" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="372" y1="85" x2="380" y2="85" stroke="rgb(10,22,38)" stroke-width="1.6" marker-end="url(#ah14)"/>
<rect x="381" y="50" width="112" height="70" rx="8" ry="8" fill="#ffd8d8" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="437.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)">4 · systemd</text>
<text x="437.0" y="98.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.2" fill="rgb(90,100,120)">PID 1, services</text>
<defs><marker id="ah19" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="494" y1="85" x2="502" y2="85" stroke="rgb(10,22,38)" stroke-width="1.6" marker-end="url(#ah19)"/>
<rect x="503" y="50" width="112" height="70" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="559.0" y="83.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)">5 · Target</text>
<text x="559.0" y="98.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.2" fill="rgb(90,100,120)">login (texte/graphique)</text>
<text x="320" y="150" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">BIOS : lit le MBR (446 premiers octets). UEFI : lit un fichier .efi sur la partition ESP (/boot/efi).</text>
<text x="320" y="164" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.8" fill="rgb(90,100,120)" style="">initramfs : mini-système en RAM qui contient les pilotes pour trouver le vrai disque racine (LVM, RAID, chiffrement).</text>
<text x="320" y="178" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="8.8" fill="#1C7ED6" style="font-style:italic;">En panne, la première question : à quel étage cela s'est-il arrêté ?</text>
</svg>