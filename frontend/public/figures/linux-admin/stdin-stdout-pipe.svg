<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>stdin, stdout, stderr et le pipe entre deux commandes</title>
<rect x="0" y="0" width="640" height="220" fill="#ffffff"/>
<text x="320" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="12" fill="rgb(90,100,120)" style="">Trois flux standards, et un pipe entre deux commandes</text>
<rect x="30" y="46" width="90" height="50" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="75.0" y="69.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10" fill="rgb(10,22,38)">stdin</text>
<text x="75.0" y="84.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" fill="rgb(90,100,120)">0 · clavier</text>
<defs><marker id="ah4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="rgb(10,22,38)"/></marker></defs>
<line x1="120" y1="71" x2="170" y2="71" stroke="rgb(10,22,38)" stroke-width="1.6" marker-end="url(#ah4)"/>
<rect x="170" y="46" width="140" height="50" rx="9" ry="9" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="240.0" y="75.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">ls /etc</text>
<defs><marker id="ah8" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#166534"/></marker></defs>
<line x1="310" y1="60" x2="360" y2="60" stroke="#166534" stroke-width="1.8" marker-end="url(#ah8)"/>
<text x="335.0" y="54.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="#166534">stdout (1)</text>
<defs><marker id="ah11" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#B91C1C"/></marker></defs>
<line x1="310" y1="82" x2="360" y2="82" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah11)"/>
<text x="335.0" y="76.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="#B91C1C">stderr (2)</text>
<rect x="360" y="36" width="90" height="32" rx="7" ry="7" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="405.0" y="56.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">écran</text>
<rect x="360" y="76" width="90" height="32" rx="7" ry="7" fill="#ffe2e2" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="405.0" y="96.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9" fill="rgb(10,22,38)">écran</text>
<rect x="170" y="130" width="140" height="50" rx="9" ry="9" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="240.0" y="159.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">cmd1</text>
<defs><marker id="ah20" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1C7ED6"/></marker></defs>
<line x1="310" y1="155" x2="400" y2="155" stroke="#1C7ED6" stroke-width="2" marker-end="url(#ah20)"/>
<text x="355.0" y="149.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9.5" font-weight="700" fill="#1C7ED6">|  (pipe)</text>
<rect x="400" y="130" width="140" height="50" rx="9" ry="9" fill="#ffe8cc" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="470.0" y="159.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="11" fill="rgb(10,22,38)">cmd2</text>
<text x="320" y="196" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="600" font-size="9" fill="rgb(90,100,120)" style="">Le pipe (|) branche le stdout de cmd1 directement sur le stdin de cmd2 : aucun fichier intermédiaire.</text>
<text x="320" y="210" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.6" fill="rgb(90,100,120)" style="">cmd &gt; f : écrase f  ·  cmd &gt;&gt; f : ajoute à f  ·  cmd 2&gt;&amp;1 : fusionne stderr dans stdout</text>
</svg>