<svg width="640" height="236" viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Authentification SSH par clés</title>
<rect x="0" y="0" width="640" height="236" fill="#ffffff"/>
<text x="320" y="20" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" font-size="11.2" fill="rgb(90,100,120)" style="">Authentification SSH par clés : une seule paire, aucun mot de passe transmis</text>
<rect x="60" y="42" width="150" height="28" rx="14.0" ry="14.0" fill="#1C7ED6"/>
<text x="135.0" y="59.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">Client (Alice)</text>
<rect x="430" y="42" width="150" height="28" rx="14.0" ry="14.0" fill="#0E9F9A"/>
<text x="505.0" y="59.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.5" fill="#fff">Serveur</text>
<rect x="30" y="86" width="200" height="60" rx="8" ry="8" fill="#eef3fb" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="130" y="106" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="10.5" fill="rgb(10,22,38)" style="">ssh-keygen</text>
<text x="130" y="121" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="7.8" fill="rgb(90,100,120)" style="">paire : clé privée (gardée)</text>
<text x="130" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="7.8" fill="rgb(90,100,120)" style="">+ clé publique</text>
<defs><marker id="ah9" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#1C7ED6"/></marker></defs>
<line x1="230" y1="116" x2="410" y2="116" stroke="#1C7ED6" stroke-width="1.8" marker-end="url(#ah9)"/>
<text x="320.0" y="110.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" font-weight="700" fill="#1C7ED6">ssh-copy-id : dépose la clé PUBLIQUE</text>
<rect x="410" y="86" width="200" height="60" rx="8" ry="8" fill="#d7e8ff" stroke="rgb(10,22,38)" stroke-width="1.3"/>
<text x="510" y="106" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="9.6" fill="rgb(10,22,38)" style="">authorized_keys</text>
<text x="510" y="121" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="7.8" fill="rgb(90,100,120)" style="">la clé publique d'Alice,</text>
<text x="510" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="7.8" fill="rgb(90,100,120)" style="">une par ligne</text>
<defs><marker id="ah16" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#0E9F9A"/></marker></defs>
<line x1="230" y1="168" x2="410" y2="168" stroke="#0E9F9A" stroke-width="1.8" marker-end="url(#ah16)"/>
<text x="320.0" y="162.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" font-weight="700" fill="#0E9F9A">défi chiffré avec la clé publique d'Alice</text>
<defs><marker id="ah19" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#0E9F9A"/></marker></defs>
<line x1="410" y1="183" x2="230" y2="183" stroke="#0E9F9A" stroke-width="1.8" marker-end="url(#ah19)"/>
<text x="320.0" y="177.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8.6" font-weight="700" fill="#0E9F9A">Alice prouve qu'elle détient la clé privée</text>
<text x="320" y="210" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.4" fill="rgb(90,100,120)" style="">La clé privée (~/.ssh/id_ed25519) ne quitte jamais le poste d'Alice : le serveur ne vérifie qu'une preuve, jamais la clé.</text>
<text x="320" y="224" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-weight="500" font-size="8.4" fill="rgb(90,100,120)" style="">Permissions obligatoires : authorized_keys en 600, dossier ~/.ssh en 700 — sinon SSH refuse de les utiliser.</text>
</svg>